<text x="720" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Board</tspan>  Ø58.0 mm disc, 1.6 mm, 4 layers</text>
<text x="720" y="149.6" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Origin</tspan>  puck axis = display centre; +y towards 6 o'clock</text>
<text x="720" y="171.2" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Enclosure</tspan>  Ø64 mm, wall 2.0 mm, board-to-wall 1.0 mm</text>
<text x="720" y="192.8" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Ring</tspan>  ID 48 / OD 64 mm, 30-pole ferrite strip at r 26.3 mm, gap 1.5 mm</text>
<text x="720" y="214.4" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Notch</tspan>  21.4 x 5.9 mm, inner edge y 23.10 (antenna boundary)</text>
<text x="720" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Display</tspan>  active Ø32.4, outline Ø35.6, panel 2.7 / window 4.9 mm above PCB</text>
<text x="720" y="257.6" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Zone A</tspan>  F.Cu under the panel: parts &lt;= 1.2 mm</text>
<text x="720" y="279.2" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Zone B</tspan>  B.Cu over the cell: parts &lt;= 3.2 mm, 0.3 mm insulator</text>
<text x="720" y="300.8" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Press</tspan>  switch stem at (0.0, -2.5), 0.25 mm travel, 2.55 N</text>
<text x="720" y="322.4" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Window</tspan>  sensor band r 18.3-23.5 mm: IR-clear at 11 and 3 o'clock</text>
<text x="720" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Fixing</tspan>  2 x M2 into heat-set inserts, 1 plastic peg</text>
<text x="720" y="365.6" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Tail</tspan>  stock 70.1 mm FPC, one loop under the panel turning in a 2.4 mm well</text>
<text x="720" y="387.2" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold"></tspan>  of the carrier (x 6..12), through the slot (x -19.3..-18.3) to J301 on B</text>
<text x="720" y="408.8" font-family="Helvetica, Arial, sans-serif" font-size="12"><tspan font-weight="bold">Panel tabs</tspan>  130 and 328 deg clockwise from the USB-C: no copper within 1.55 mm of the rim</text>
